[versions]
agp = "9.5.1"
libxposed = "102.0.0"
junit = "4.13.2"
kotlin = "2.4.21"
activity = "1.13.0"
lifecycle = "2.11.0"
compose = "1.12.2"
coroutines = "1.11.0"
# Keep the remote version when enabling the local composite build.
miuix = "0.9.4-45645854-SNAPSHOT"
material-icons = "1.7.8"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
junit = { module = "junit:junit", version.ref = "junit" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
miuix-glass = { module = "top.yukonga.miuix.kmp:miuix-glass-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
